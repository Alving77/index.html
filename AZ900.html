<title>AZ-900 Estudio Bilingüe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky toolbar on top, then one card per question; EN and ES side by side on wide screens, stacked on phones */
:root{--bg:#f3f6f9;--card:#ffffff;--fg:#14202b;--mute:#586877;--line:#d6dee6;--accent:#0a64b4;--accent-bg:#e4f0fb;--ok:#14733c;--ok-bg:#e1f4e8;--no:#a3321f;--no-bg:#fbe9e5;--es:#fff7e0;--font:'Inter',system-ui,sans-serif;--head:'Space Grotesk','Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--card:#15222f;--fg:#e6edf4;--mute:#9bacbc;--line:#2a3b4c;--accent:#5ab0f2;--accent-bg:#16314a;--ok:#6fd49a;--ok-bg:#12392a;--no:#ff9a86;--no-bg:#432019;--es:#2b2610;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1620;--card:#15222f;--fg:#e6edf4;--mute:#9bacbc;--line:#2a3b4c;--accent:#5ab0f2;--accent-bg:#16314a;--ok:#6fd49a;--ok-bg:#12392a;--no:#ff9a86;--no-bg:#432019;--es:#2b2610;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;margin:0}
.wrap{max-width:1100px;margin:0 auto}
header{padding:28px 0 12px}
h1{font:700 28px/1.15 var(--head);margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--mute);max-width:70ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--card);color:var(--fg);border:0;padding:7px 12px;font:500 13px var(--font);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search],select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:14px var(--font);min-width:0}
input[type=search]{flex:1 1 160px}
.btn{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:500 13px var(--font);cursor:pointer}
.stat{color:var(--mute);font-size:13px;margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:16px;padding:16px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.num{font:700 15px var(--head);background:var(--accent-bg);color:var(--accent);padding:3px 10px;border-radius:5px}
.tag{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.done{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols.one{grid-template-columns:1fr}
.col{min-width:0}
.col.es{background:var(--es);border-radius:6px;padding:12px}
.col.en{padding:12px;border:1px solid var(--line);border-radius:6px}
.lang{font:700 11px var(--font);letter-spacing:.1em;color:var(--mute);margin-bottom:6px}
.q{white-space:pre-line;font-weight:500;margin:0 0 10px}
ul.opts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.opts li{display:flex;gap:8px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--card)}
ul.opts b{font-family:var(--head);color:var(--accent);flex:none}
ul.opts li.right{border-color:var(--ok);background:var(--ok-bg)}
.rows{display:grid;gap:6px}
.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--card)}
.row span.t{min-width:0}
.pill{flex:none;font:600 12px var(--font);border-radius:99px;padding:2px 10px;border:1px solid var(--line);color:var(--mute);background:var(--bg)}
.pill.y{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.pill.n{color:var(--no);background:var(--no-bg);border-color:var(--no)}
.pill.m{color:var(--accent);background:var(--accent-bg);border-color:var(--accent)}
.pool{font-size:13px;color:var(--mute);margin-top:8px}
.foot{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.show{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:600 13px var(--font);cursor:pointer}
.why{flex:1 1 280px;min-width:0;background:var(--ok-bg);border-radius:6px;padding:8px 12px;font-size:14px}
.why b{color:var(--ok)}
.hide{display:none!important}
.empty{color:var(--mute);text-align:center;padding:40px 0}
@media (max-width:760px){.cols{grid-template-columns:1fr}.stat{margin-left:0;width:100%}h1{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
<div class="wrap">
<header>
<h1>AZ-900: 120 preguntas en inglés y español</h1>
<p>Cada pregunta aparece en los dos idiomas. Pulsa «Ver respuesta» para ver la correcta y una explicación breve en español. Las preguntas de arrastrar/soltar y de «hotspot» (imágenes en el original) están reescritas en texto.</p>
</header>
<div class="bar" role="toolbar" aria-label="Opciones">
<div class="seg" id="langseg"><button data-l="both" aria-pressed="true">ES + EN</button><button data-l="es" aria-pressed="false">Solo ES</button><button data-l="en" aria-pressed="false">Solo EN</button></div>
<select id="range" aria-label="Rango de preguntas"></select>
<select id="kind" aria-label="Tipo de pregunta"><option value="all">Todos los tipos</option><option value="mc">Elegir opción</option><option value="yn">Sí / No por afirmación</option><option value="match">Relacionar</option></select>
<input type="search" id="q" placeholder="Buscar (ej. PaaS, resource group)" aria-label="Buscar">
<button class="btn" id="all">Ver todas las respuestas</button>
<button class="btn" id="pend" aria-pressed="false">Solo pendientes</button>
<span class="stat" id="stat"></span>
</div>
<main id="list"></main>
</div>
<script>
const DATA=[{"n": 1, "kind": "mc", "qEn": "Your company intends to subscribe to an Azure support plan. The support plan must allow for new support requests to be opened. Which of the following are support plans that will allow this? (Select all that apply.)", "qEs": "Tu empresa piensa contratar un plan de soporte de Azure. El plan debe permitir abrir nuevas solicitudes de soporte. ¿Cuáles de los siguientes planes lo permiten? (Marca todos los que correspondan.)", "oEn": ["Basic", "Developer", "Standard", "Professional Direct", "Premier"], "oEs": ["Basic", "Developer", "Standard", "Professional Direct", "Premier"], "ans": [0, 1, 2, 3], "why": "⚠ Todos los planes de pago permiten abrir solicitudes y la clave excluye Premier, que es dudoso. Confírmalo con tu profe.", "multi": true, "diagram": false, "disputed": true}, {"n": 2, "kind": "mc", "qEn": "Your company has datacenters in Los Angeles and New York. The company has a Microsoft Azure subscription.\nYou are configuring the two datacenters as geo-clustered sites for site resiliency.\nYou need to recommend an Azure storage redundancy option.\nYou have the following data storage requirements:\n✑ Data must be stored on multiple nodes.\n✑ Data must be stored on nodes in separate geographic locations.\n✑ Data can be read from the secondary location as well as from the primary location\nWhich of the following Azure stored redundancy options should you recommend?", "qEs": "Tu empresa tiene centros de datos en Los Ángeles y Nueva York, y una suscripción de Microsoft Azure. Estás configurando los dos centros de datos como sitios geo-agrupados (geo-clustered) para dar resiliencia al sitio. Debes recomendar una opción de redundancia de almacenamiento de Azure. Requisitos de almacenamiento:\n✑ Los datos deben guardarse en varios nodos.\n✑ Los datos deben guardarse en nodos de ubicaciones geográficas distintas.\n✑ Los datos se pueden leer tanto desde la ubicación secundaria como desde la principal.\n¿Qué opción de redundancia de almacenamiento de Azure debes recomendar?", "oEn": ["Geo-redundant storage", "Read-only geo-redundant storage", "Zone-redundant storage", "Locally redundant storage"], "oEs": ["Almacenamiento con redundancia geográfica (GRS)", "Almacenamiento con redundancia geográfica de solo lectura (RA-GRS)", "Almacenamiento con redundancia de zona (ZRS)", "Almacenamiento con redundancia local (LRS)"], "ans": [1], "why": "RA-GRS copia los datos a otra región y permite LEER desde la secundaria. GRS también copia, pero la secundaria no se puede leer.", "multi": false}, {"n": 3, "kind": "mc", "qEn": "Your company's Azure subscription includes a Basic support plan.\nThey would like to request an assessment of an Azure environment's design from Microsoft. This is, however, not supported by the existing plan.\nYou want to make sure that the company subscribes to a support plan that allows this functionality, while keeping expenses to a minimum.\nSolution: You recommend that the company subscribes to the Professional Direct support plan.\nDoes the solution meet the goal?", "qEs": "La suscripción de Azure de tu empresa incluye un plan de soporte Basic. Quieren pedirle a Microsoft una evaluación del diseño de un entorno de Azure, pero el plan actual no lo permite. Quieres asegurarte de que la empresa contrate un plan de soporte que permita esa funcionalidad, manteniendo los costes al mínimo.\nSolución: recomiendas que la empresa contrate el plan de soporte Professional Direct.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "⚠ Respuesta discutida en la comunidad (No 63 % / Sí 36 %). Confírmala con tu profe.", "multi": false, "disputed": true}, {"n": 4, "kind": "mc", "qEn": "You are tasked with deploying Azure virtual machines for your company.\nYou need to make use of the appropriate cloud deployment solution.\nSolution: You should make use of Software as a Service (SaaS).\nDoes the solution meet the goal?", "qEs": "Se te encarga desplegar máquinas virtuales (VM) de Azure para tu empresa. Debes usar la solución de despliegue en la nube adecuada.\nSolución: Debes usar Software como Servicio (SaaS).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Las VM de Azure son IaaS, no SaaS.", "multi": false}, {"n": 5, "kind": "mc", "qEn": "You are tasked with deploying Azure virtual machines for your company.\nYou need to make use of the appropriate cloud deployment solution.\nSolution: You should make use of Platform as a Service (PaaS).\nDoes the solution meet the goal?", "qEs": "Se te encarga desplegar máquinas virtuales (VM) de Azure para tu empresa. Debes usar la solución de despliegue en la nube adecuada.\nSolución: Debes usar Plataforma como Servicio (PaaS).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Las VM de Azure son IaaS, no PaaS.", "multi": false}, {"n": 6, "kind": "mc", "qEn": "You are tasked with deploying Azure virtual machines for your company.\nYou need to make use of the appropriate cloud deployment solution.\nSolution: You should make use of Infrastructure as a Service (IaaS).\nDoes the solution meet the goal?", "qEs": "Se te encarga desplegar máquinas virtuales (VM) de Azure para tu empresa. Debes usar la solución de despliegue en la nube adecuada.\nSolución: Debes usar Infraestructura como Servicio (IaaS).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Las máquinas virtuales son el ejemplo típico de IaaS.", "multi": false}, {"n": 7, "kind": "mc", "qEn": "Your developers have created 10 web applications that must be host on Azure.\nYou need to determine which Azure web tier plan to host the web apps. The web tier plan must meet the following requirements:\n✑ The web apps will use custom domains.\n✑ The web apps each require 10 GB of storage.\n✑ The web apps must each run in dedicated compute instances.\n✑ Load balancing between instances must be included.\n✑ Costs must be minimized.\nWhich web tier plan should you use?", "qEs": "Tus desarrolladores han creado 10 aplicaciones web que deben alojarse en Azure. Debes decidir qué plan del nivel web (web tier) de Azure usar. El plan debe cumplir estos requisitos:\n✑ Las aplicaciones web usarán dominios personalizados.\n✑ Cada aplicación web necesita 10 GB de almacenamiento.\n✑ Cada aplicación web debe ejecutarse en instancias de cómputo dedicadas.\n✑ Debe incluirse el balanceo de carga entre instancias.\n✑ Se deben minimizar los costes.\n¿Qué plan debes usar?", "oEn": ["Standard", "Basic", "Free", "Shared"], "oEs": ["Standard", "Basic", "Free", "Shared"], "ans": [0], "why": "⚠ Discutida: Basic también cumple dominio personalizado, 10 GB y balanceo, y es más barato. La clave da Standard. Confírmala con tu profe.", "multi": false, "disputed": true}, {"n": 8, "kind": "mc", "qEn": "You are planning to migrate a company to Azure. Each of the company's numerous divisions will have an administrator in place to manage the Azure resources used by their respective division.\nYou want to make sure that the Azure deployment you employ allows for Azure to be segmented for the divisions, while keeping administrative effort to a minimum.\nSolution: You plan to make use of several Azure Active Directory (Azure AD) directories.\nDoes the solution meet the goal?", "qEs": "Planeas migrar una empresa a Azure. Cada una de sus numerosas divisiones tendrá un administrador que gestione los recursos de Azure de su división. Quieres que el despliegue de Azure permita segmentar Azure por divisiones, manteniendo el esfuerzo administrativo al mínimo.\nSolución: planeas usar varios directorios de Azure Active Directory (Azure AD).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Varios directorios aumentan mucho la administración. Para segmentar basta con varias suscripciones (o grupos de recursos).", "multi": false}, {"n": 9, "kind": "mc", "qEn": "Your developers have created a portal web app for users in the Miami branch office. The web app will be publicly accessible and used by the Miami users to retrieve customer and product information. The web app is currently running in an on-premises test environment.\nYou plan to host the web app on Azure.\nYou need to determine which Azure web tier plan to host the web app. The web tier plan must meet the following requirements:\n✑ The website will use the miami.weyland.com URL.\n✑ The website will be deployed to two instances.\n✑ SSL support must be included.\n✑ The website requires 12 GB of storage.\n✑ Costs must be minimized.\nWhich web tier plan should you use?", "qEs": "Tus desarrolladores han creado una aplicación web de portal para los usuarios de la oficina de Miami. La aplicación será pública y los usuarios de Miami la usarán para consultar información de clientes y productos. Ahora está en un entorno de pruebas local (on-premises). Planeas alojarla en Azure. Debes decidir qué plan del nivel web de Azure usar. Requisitos:\n✑ El sitio usará la URL miami.weyland.com.\n✑ El sitio se desplegará en dos instancias.\n✑ Debe incluir soporte SSL.\n✑ El sitio necesita 12 GB de almacenamiento.\n✑ Se deben minimizar los costes.\n¿Qué plan debes usar?", "oEn": ["Standard", "Basic", "Free", "Shared"], "oEs": ["Standard", "Basic", "Free", "Shared"], "ans": [0], "why": "Basic solo da 10 GB y se necesitan 12 GB; Free/Shared no sirven para 2 instancias dedicadas. Queda Standard.", "multi": false}, {"n": 10, "kind": "mc", "qEn": "Your company is planning to migrate all their virtual machines to an Azure pay-as-you-go subscription. The virtual machines are currently hosted on the Hyper-V hosts in a data center.\nYou are required make sure that the intended Azure solution uses the correct expenditure model.\nSolution: You should recommend the use of the elastic expenditure model.\nDoes the solution meet the goal?", "qEs": "Tu empresa planea migrar todas sus máquinas virtuales a una suscripción de Azure de pago por uso (pay-as-you-go). Las VM están alojadas actualmente en hosts Hyper-V de un centro de datos. Debes asegurarte de que la solución de Azure use el modelo de gasto correcto.\nSolución: Recomiendas usar el modelo de gasto elástico (elastic).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "El pago por uso es gasto operativo (OpEx); «elástico» no es un modelo de gasto.", "multi": false}, {"n": 11, "kind": "mc", "qEn": "Your company is planning to migrate all their virtual machines to an Azure pay-as-you-go subscription. The virtual machines are currently hosted on the Hyper-V hosts in a data center.\nYou are required make sure that the intended Azure solution uses the correct expenditure model.\nSolution: You should recommend the use of the scalable expenditure model.\nDoes the solution meet the goal?", "qEs": "Tu empresa planea migrar todas sus máquinas virtuales a una suscripción de Azure de pago por uso (pay-as-you-go). Las VM están alojadas actualmente en hosts Hyper-V de un centro de datos. Debes asegurarte de que la solución de Azure use el modelo de gasto correcto.\nSolución: Recomiendas usar el modelo de gasto escalable (scalable).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "El pago por uso es gasto operativo (OpEx); «escalable» no es un modelo de gasto.", "multi": false}, {"n": 12, "kind": "mc", "qEn": "Your company is planning to migrate all their virtual machines to an Azure pay-as-you-go subscription. The virtual machines are currently hosted on the Hyper-V hosts in a data center.\nYou are required make sure that the intended Azure solution uses the correct expenditure model.\nSolution: You should recommend the use of the operational expenditure model.\nDoes the solution meet the goal?", "qEs": "Tu empresa planea migrar todas sus máquinas virtuales a una suscripción de Azure de pago por uso (pay-as-you-go). Las VM están alojadas actualmente en hosts Hyper-V de un centro de datos. Debes asegurarte de que la solución de Azure use el modelo de gasto correcto.\nSolución: Recomiendas usar el modelo de gasto operativo (OpEx).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Pago por uso = gasto operativo (OpEx), no gasto de capital (CapEx).", "multi": false}, {"n": 13, "kind": "mc", "qEn": "You are required to deploy an Artificial Intelligence (AI) solution in Azure.\nYou want to make sure that you are able to build, test, and deploy predictive analytics for the solution.\nSolution: You should make use of Azure Cosmos DB.\nDoes the solution meet the goal?", "qEs": "Debes desplegar una solución de Inteligencia Artificial (IA) en Azure. Quieres poder construir, probar y desplegar analítica predictiva para la solución.\nSolución: Debes usar Azure Cosmos DB.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Cosmos DB es una base de datos, no una herramienta de aprendizaje automático.", "multi": false}, {"n": 14, "kind": "mc", "qEn": "Your company's Active Directory forest includes thousands of user accounts.\nYou have been informed that all network resources will be migrated to Azure. Thereafter, the on-premises data center will be retired.\nYou are required to employ a strategy that reduces the effect on users, once the planned migration has been completed.\nSolution: You plan to sync all the Active Directory user accounts to Azure Active Directory (Azure AD).\nDoes the solution meet the goal?", "qEs": "El bosque de Active Directory de tu empresa incluye miles de cuentas de usuario. Te han informado de que todos los recursos de red se migrarán a Azure y que después se cerrará el centro de datos local. Debes aplicar una estrategia que reduzca el impacto en los usuarios una vez completada la migración.\nSolución: Planeas sincronizar todas las cuentas de usuario de Active Directory con Azure Active Directory (Azure AD).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Sincronizar las cuentas con Azure AD permite a los usuarios seguir usando las mismas credenciales.", "multi": false}, {"n": 15, "kind": "mc", "qEn": "You are required to deploy an Artificial Intelligence (AI) solution in Azure.\nYou want to make sure that you are able to build, test, and deploy predictive analytics for the solution.\nSolution: You should make use of Azure Machine Learning Studio.\nDoes the solution meet the goal?", "qEs": "Debes desplegar una solución de Inteligencia Artificial (IA) en Azure. Quieres poder construir, probar y desplegar analítica predictiva para la solución.\nSolución: Debes usar Azure Machine Learning Studio.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Azure Machine Learning sirve para construir, probar y desplegar analítica predictiva.", "multi": false}, {"n": 16, "kind": "mc", "qEn": "Your company's infrastructure includes a number of business units that each need a large number of various Azure resources for everyday operation.\nThe resources required by each business unit are identical.\nYou are required to sanction a strategy to create Azure resources automatically.\nSolution: You recommend that the Azure API Management service be included in the strategy.\nDoes the solution meet the goal?", "qEs": "La infraestructura de tu empresa incluye varias unidades de negocio que necesitan muchos recursos de Azure distintos para su operación diaria. Los recursos que necesita cada unidad de negocio son idénticos. Debes aprobar una estrategia para crear los recursos de Azure de forma automática.\nSolución: Recomiendas incluir el servicio Azure API Management en la estrategia.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "API Management publica y gestiona APIs; no crea recursos automáticamente.", "multi": false}, {"n": 17, "kind": "mc", "qEn": "Your company's infrastructure includes a number of business units that each need a large number of various Azure resources for everyday operation.\nThe resources required by each business unit are identical.\nYou are required to sanction a strategy to create Azure resources automatically.\nSolution: You recommend that management groups be included in the strategy.\nDoes the solution meet the goal?", "qEs": "La infraestructura de tu empresa incluye varias unidades de negocio que necesitan muchos recursos de Azure distintos para su operación diaria. Los recursos que necesita cada unidad de negocio son idénticos. Debes aprobar una estrategia para crear los recursos de Azure de forma automática.\nSolución: Recomiendas incluir grupos de administración (management groups) en la estrategia.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "⚠ Discutida entre varias respuestas en la comunidad. Confírmala con tu profe.", "multi": false, "disputed": true}, {"n": 18, "kind": "mc", "qEn": "Your company's infrastructure includes a number of business units that each need a large number of various Azure resources for everyday operation.\nThe resources required by each business unit are identical.\nYou are required to sanction a strategy to create Azure resources automatically.\nSolution: You recommend that the Azure Resource Manager templates be included in the strategy.\nDoes the solution meet the goal?", "qEs": "La infraestructura de tu empresa incluye varias unidades de negocio que necesitan muchos recursos de Azure distintos para su operación diaria. Los recursos que necesita cada unidad de negocio son idénticos. Debes aprobar una estrategia para crear los recursos de Azure de forma automática.\nSolución: Recomiendas incluir plantillas de Azure Resource Manager (ARM) en la estrategia.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Las plantillas ARM despliegan los mismos recursos de forma repetible y automática.", "multi": false}, {"n": 19, "kind": "mc", "qEn": "You are tasked with deploying a critical LOB application, which will be installed on a virtual machine, to Azure.\nYou are informed that the application deployment strategy should allow for a guaranteed availability of 99.99 percent. You need to make sure that the strategy requires as little virtual machines and availability zones as possible.\nSolution: You include two virtual machines and one availability zone in your strategy.\nDoes the solution meet the goal?", "qEs": "Debes desplegar en Azure una aplicación LOB (línea de negocio) crítica, que se instalará en una máquina virtual. Te informan de que la estrategia de despliegue debe garantizar una disponibilidad del 99,99 %. Debes asegurarte de que la estrategia requiera el menor número posible de máquinas virtuales y zonas de disponibilidad.\nSolución: Incluyes dos máquinas virtuales y una zona de disponibilidad en tu estrategia.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Para el 99,99 % hacen falta 2 VM en 2 zonas de disponibilidad distintas.", "multi": false}, {"n": 20, "kind": "mc", "qEn": "You are tasked with deploying a critical LOB application, which will be installed on a virtual machine, to Azure.\nYou are informed that the application deployment strategy should allow for a guaranteed availability of 99.99 percent. You need to make sure that the strategy requires as little virtual machines and availability zones as possible.\nSolution: You include one virtual machine and two availability zones in your strategy.\nDoes the solution meet the goal?", "qEs": "Debes desplegar en Azure una aplicación LOB (línea de negocio) crítica, que se instalará en una máquina virtual. Te informan de que la estrategia de despliegue debe garantizar una disponibilidad del 99,99 %. Debes asegurarte de que la estrategia requiera el menor número posible de máquinas virtuales y zonas de disponibilidad.\nSolución: Incluyes una máquina virtual y dos zonas de disponibilidad en tu estrategia.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Con una sola VM no hay copia en la otra zona. Hacen falta 2 VM.", "multi": false}, {"n": 21, "kind": "mc", "qEn": "You are tasked with deploying a critical LOB application, which will be installed on a virtual machine, to Azure.\nYou are informed that the application deployment strategy should allow for a guaranteed availability of 99.99 percent. You need to make sure that the strategy requires as little virtual machines and availability zones as possible.\nSolution: You include two virtual machines and two availability zones in your strategy.\nDoes the solution meet the goal?", "qEs": "Debes desplegar en Azure una aplicación LOB (línea de negocio) crítica, que se instalará en una máquina virtual. Te informan de que la estrategia de despliegue debe garantizar una disponibilidad del 99,99 %. Debes asegurarte de que la estrategia requiera el menor número posible de máquinas virtuales y zonas de disponibilidad.\nSolución: Incluyes dos máquinas virtuales y dos zonas de disponibilidad en tu estrategia.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "2 VM, cada una en una zona distinta = SLA del 99,99 %.", "multi": false}, {"n": 22, "kind": "mc", "qEn": "Your company's developers intend to deploy a large number of custom virtual machines on a weekly basis. They will also be removing these virtual machines during the same week it was deployed. Sixty percent of the virtual machines have Windows Server 2016 installed, while the other forty percent has Ubuntu Linux installed.\nYou are required to make sure that the administrative effort, needed for this process, is reduced by employing a suitable Azure service.\nSolution: You recommend the use of Microsoft Managed Desktop.\nDoes the solution meet the goal?", "qEs": "Los desarrolladores de tu empresa quieren desplegar cada semana una gran cantidad de máquinas virtuales personalizadas, y eliminarlas la misma semana en que se desplegaron. El 60 % de las VM tienen Windows Server 2016 y el otro 40 % tiene Ubuntu Linux. Debes reducir el esfuerzo administrativo de este proceso usando un servicio de Azure adecuado.\nSolución: Recomiendas usar Microsoft Managed Desktop.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Managed Desktop es para gestionar PC de usuarios, no para laboratorios de VM.", "multi": false}, {"n": 23, "kind": "mc", "qEn": "Your company's developers intend to deploy a large number of custom virtual machines on a weekly basis. They will also be removing these virtual machines during the same week it was deployed. Sixty percent of the virtual machines have Windows Server 2016 installed, while the other forty percent has Ubuntu Linux installed.\nYou are required to make sure that the administrative effort, needed for this process, is reduced by employing a suitable Azure service.\nSolution: You recommend the use of Azure Reserved Virtual Machines (VM) Instances.\nDoes the solution meet the goal?", "qEs": "Los desarrolladores de tu empresa quieren desplegar cada semana una gran cantidad de máquinas virtuales personalizadas, y eliminarlas la misma semana en que se desplegaron. El 60 % de las VM tienen Windows Server 2016 y el otro 40 % tiene Ubuntu Linux. Debes reducir el esfuerzo administrativo de este proceso usando un servicio de Azure adecuado.\nSolución: Recomiendas usar Instancias de máquina virtual reservadas (Azure Reserved VM Instances).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Las reservas ahorran dinero con uso a largo plazo; aquí las VM duran una semana.", "multi": false}, {"n": 24, "kind": "mc", "qEn": "Your company's developers intend to deploy a large number of o (S2S).", "Configurar una VPN de VNet a VNet.", "Configurar una VPN de punto a sitio (P2S).", "Configurar DirectAccess en una VM con Windows Server 2012.", "Configurar una VPN multisitio."], "ans": [2], "why": "P2S conecta equipos individuales (usuarios remotos) a una red virtual. S2S conecta redes completas.", "multi": false}, {"n": 26, "kind": "mc", "qEn": "You have been informed by your superiors of the company's intentions to automate server deployment to Azure. There is, however, some concern that administrative credentials could be uncovered during this process.\nYou are required to make sure that during the deployment, the administrative credentials are encrypted using a suitable Azure solution.\nSolution: You recommend the use of Azure Information Protection.\nDoes the solution meet the goal?", "qEs": "Tus superiores te informan de que la empresa quiere automatizar el despliegue de servidores en Azure. Sin embargo, preocupa que las credenciales administrativas queden expuestas durante el proceso. Debes asegurarte de que, durante el despliegue, las credenciales administrativas se cifren usando una solución de Azure adecuada.\nSolución: Recomiendas usar Azure Information Protection.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "La solución correcta para proteger secretos/credenciales en despliegues es Azure Key Vault.", "multi": false}, {"n": 27, "kind": "mc", "qEn": "You have been informed by your superiors of the company's intentions to automate server deployment to Azure. There is, however, some concern that administrative credentials could be uncovered during this process.\nYou are required to make sure that during the deployment, the administrative credentials are encrypted using a suitable Azure solution.\nSolution: You recommend the use of Azure Multi-Factor Authentication (MFA).\nDoes the solution meet the goal?", "qEs": "Tus superiores te informan de que la empresa quiere automatizar el despliegue de servidores en Azure. Sin embargo, preocupa que las credenciales administrativas queden expuestas durante el proceso. Debes asegurarte de que, durante el despliegue, las credenciales administrativas se cifren usando una solución de Azure adecuada.\nSolución: Recomiendas usar Azure Multi-Factor Authentication (MFA).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "MFA protege el inicio de sesión, no cifra credenciales durante un despliegue (eso lo hace Key Vault).", "multi": false}, {"n": 28, "kind": "mc", "qEn": "The company would like to develop a cloud solution by making use of Azure Government. Azure Government can only be used by certain types of clients. Which are the types of customers that can use Azure Government? (Select two.)", "qEs": "La empresa quiere desarrollar una solución en la nube con Azure Government. Azure Government solo puede ser usado por ciertos tipos de clientes. ¿Qué tipos de clientes pueden usar Azure Government? (Elige dos.)", "oEn": ["A government contractor from any country.", "A government entity from any country.", "A European government contractor.", "A European government entity.", "A United States government contractor.", "A United States government entity."], "oEs": ["Un contratista del gobierno de cualquier país.", "Una entidad gubernamental de cualquier país.", "Un contratista del gobierno europeo.", "Una entidad del gobierno europeo.", "Un contratista del gobierno de EE. UU.", "Una entidad del gobierno de EE. UU."], "ans": [4, 5], "why": "Azure Government es una nube aislada solo para el gobierno de EE. UU. y sus contratistas.", "multi": true, "diagram": false}, {"n": 29, "kind": "mc", "qEn": "Your company has an Azure Active Directory (Azure AD) environment. Users occasionally connect to Azure AD via the Internet.\nYou have been tasked with making sure that users who connect to Azure AD via the internet from an unidentified IP address, are automatically encouraged to change passwords.\nSolution: You configure the use of Azure AD Identity Protection.\nDoes the solution meet the goal?", "qEs": "Tu empresa tiene un entorno de Azure Active Directory (Azure AD). Los usuarios a veces se conectan a Azure AD por Internet. Debes asegurarte de que los usuarios que se conectan a Azure AD por Internet desde una dirección IP no identificada reciban automáticamente la indicación de cambiar su contraseña.\nSolución: Configuras el uso de Azure AD Identity Protection.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Identity Protection detecta inicios de sesión de riesgo (p. ej., IP desconocida) y puede forzar el cambio de contraseña.", "multi": false}, {"n": 30, "kind": "mc", "qEn": "Your company has an Azure Active Directory (Azure AD) environment. Users occasionally connect to Azure AD via the Internet.\nYou have been tasked with making sure that users who connect to Azure AD via the internet from an unidentified IP address, are automatically encouraged to change passwords.\nSolution: You configure the use of Azure AD Privileged Identity Management.\nDoes the solution meet the goal?", "qEs": "Tu empresa tiene un entorno de Azure Active Directory (Azure AD). Los usuarios a veces se conectan a Azure AD por Internet. Debes asegurarte de que los usuarios que se conectan a Azure AD por Internet desde una dirección IP no identificada reciban automáticamente la indicación de cambiar su contraseña.\nSolución: Configuras el uso de Azure AD Privileged Identity Management.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "PIM gestiona el acceso privilegiado (roles); no reacciona a inicios de sesión de riesgo.", "multi": false}, {"n": 31, "kind": "mc", "qEn": "You are planning a strategy to deploy numerous web servers and database servers to Azure.\nThis strategy should allow for connection types between the web servers and database servers to be controlled.\nSolution: You include network security groups (NSGs) in your strategy.\nDoes the solution meet the goal?", "qEs": "Estás planificando una estrategia para desplegar muchos servidores web y servidores de base de datos en Azure. La estrategia debe permitir controlar los tipos de conexión entre los servidores web y los servidores de base de datos.\nSolución: Incluyes grupos de seguridad de red (NSG) en tu estrategia.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "Los NSG permiten o bloquean el tráfico entre recursos.", "multi": false}, {"n": 32, "kind": "mc", "qEn": "You are planning a strategy to deploy numerous web servers and database servers to Azure.\nThis strategy should allow for connection types between the web servers and database servers to be controlled.\nSolution: You include a local network gateway in your strategy.\nDoes the solution meet the goal?", "qEs": "Estás planificando una estrategia para desplegar muchos servidores web y servidores de base de datos en Azure. La estrategia debe permitir controlar los tipos de conexión entre los servidores web y los servidores de base de datos.\nSolución: Incluyes una puerta de enlace de red local (local network gateway) en tu estrategia.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "La local network gateway representa tu VPN local; no controla tráfico entre servidores.", "multi": false}, {"n": 33, "kind": "mc", "qEn": "Your company's Active Directory forest includes thousands of user accounts.\nYou have been informed that all network resources will be migrated to Azure. Thereafter, the on-premises data center will be retired.\nYou are required to employ a strategy that reduces the effect on users, once the planned migration has been completed.\nSolution: You plan to require Azure Multi-Factor Authentication (MFA).\nDoes the solution meet the goal?", "qEs": "El bosque de Active Directory de tu empresa incluye miles de cuentas de usuario. Te han informado de que todos los recursos de red se migrarán a Azure y que después se cerrará el centro de datos local. Debes aplicar una estrategia que reduzca el impacto en los usuarios una vez completada la migración.\nSolución: Planeas exigir Azure Multi-Factor Authentication (MFA).\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "MFA añade seguridad, pero no reduce el impacto de la migración. Lo que ayuda es sincronizar cuentas con Azure AD.", "multi": false}, {"n": 34, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "PaaS web apps provide full control of the operating system that hosts the apps.", "es": "Las aplicaciones web PaaS dan control total del sistema operativo que las aloja.", "yes": false}, {"en": "PaaS provides the ability to scale the platform automatically.", "es": "PaaS permite escalar la plataforma automáticamente.", "yes": true}, {"en": "PaaS provides professional development services to continuously add features to custom applications.", "es": "PaaS ofrece servicios de desarrollo profesional para añadir funciones continuamente a aplicaciones personalizadas.", "yes": true}], "why": "En PaaS no controlas el SO (lo gestiona Azure)."}, {"n": 35, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "Azure provides flexibility between capital expenditure (CapEx) and operational expenditure (OpEx).", "es": "Azure ofrece flexibilidad entre gasto de capital (CapEx) y gasto operativo (OpEx).", "yes": true}, {"en": "If you create two Azure virtual machines that use the B2S size, each virtual machine will always generate the same monthly costs.", "es": "Si creas dos máquinas virtuales de tamaño B2S, cada una generará siempre el mismo coste mensual.", "yes": false}, {"en": "When you stop an Azure virtual machine, you continue to pay storage costs associated to the virtual machine.", "es": "Cuando detienes una máquina virtual de Azure, sigues pagando los costes de almacenamiento asociados.", "yes": true}], "why": "El coste depende del uso y de otros recursos (discos, IP…); un disco sigue costando aunque la VM esté parada."}, {"n": 36, "kind": "mc", "qEn": "When implementing a Software as a Service (SaaS) solution, you are responsible for ____.", "qEs": "Al implementar una solución de Software como Servicio (SaaS), eres responsable de ____.", "oEn": ["configuring high availability", "defining scalability rules", "installing the SaaS solution", "configuring the SaaS solution"], "oEs": ["configurar la alta disponibilidad", "definir las reglas de escalabilidad", "instalar la solución SaaS", "configurar la solución SaaS"], "ans": [3], "why": "En SaaS solo configuras la aplicación; el proveedor se ocupa del resto.", "multi": false, "diagram": true}, {"n": 37, "kind": "mc", "qEn": "You have an on-premises network that contains several servers.\nYou plan to migrate all the servers to Azure.\nYou need to recommend a solution to ensure that some of the servers are available if a single Azure data center goes offline for an extended period.\nWhat should you include in the recommendation?", "qEs": "Tienes una red local (on-premises) con varios servidores. Planeas migrar todos los servidores a Azure. Debes recomendar una solución que garantice que algunos servidores sigan disponibles si un único centro de datos de Azure queda fuera de servicio durante un periodo prolongado. ¿Qué debes incluir en la recomendación?", "oEn": ["fault tolerance", "elasticity", "scalability", "low latency"], "oEs": ["tolerancia a fallos (fault tolerance)", "elasticidad", "escalabilidad", "baja latencia"], "ans": [0], "why": "Tolerancia a fallos = el sistema sigue funcionando aunque algo falle (p. ej., un centro de datos).", "multi": false}, {"n": 38, "kind": "mc", "qEn": "An organization that hosts its infrastructure ____ no longer requires a data center.", "qEs": "Una organización que aloja su infraestructura ____ ya no necesita un centro de datos.", "oEn": ["in a private cloud", "in a hybrid cloud", "in the public cloud", "on a Hyper-V host"], "oEs": ["en una nube privada", "en una nube híbrida", "en la nube pública", "en un host Hyper-V"], "ans": [2], "why": "Solo con la nube pública no necesitas un centro de datos propio.", "multi": false, "diagram": true}, {"n": 39, "kind": "mc", "qEn": "What are two characteristics of the public cloud? Each correct answer presents a complete solution.", "qEs": "¿Cuáles son dos características de la nube pública? Cada respuesta correcta presenta una solución completa.", "oEn": ["dedicated hardware", "unsecured connections", "limited storage", "metered pricing", "self-service management"], "oEs": ["hardware dedicado", "conexiones sin seguridad", "almacenamiento limitado", "precios medidos (pago por uso)", "gestión de autoservicio"], "ans": [3, 4], "why": "En la nube pública pagas lo que consumes y gestionas tú mismo los recursos desde un portal.", "multi": true}, {"n": 40, "kind": "mc", "qEn": "When planning to migrate a public website to Azure, you must plan to ____.", "qEs": "Al planificar la migración de un sitio web público a Azure, debes planificar ____.", "oEn": ["deploy a VPN", "pay monthly usage costs", "pay to transfer all the website data to Azure", "reduce the number of connections to the website"], "oEs": ["desplegar una VPN", "pagar los costes mensuales de uso", "pagar por transferir todos los datos del sitio web a Azure", "reducir el número de conexiones al sitio web"], "ans": [1], "why": "Azure es pago por uso: recibirás una factura mensual. La entrada de datos a Azure es gratuita.", "multi": false, "diagram": true}, {"n": 41, "kind": "mc", "qEn": "Your company plans to migrate all its data and resources to Azure.\nThe company's migration plan states that only Platform as a Service (PaaS) solutions must be used in Azure.\nYou need to deploy an Azure environment that meets the company migration plan.\nSolution: You create an Azure App Service and Azure SQL databases.\nDoes this meet the goal?", "qEs": "Tu empresa planea migrar todos sus datos y recursos a Azure. El plan de migración establece que solo se deben usar soluciones de Plataforma como Servicio (PaaS) en Azure. Debes desplegar un entorno de Azure que cumpla el plan de migración de la empresa.\nSolución: Creas un Azure App Service y bases de datos Azure SQL.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [0], "why": "App Service y Azure SQL Database son PaaS.", "multi": false}, {"n": 42, "kind": "mc", "qEn": "Your company plans to migrate all its data and resources to Azure.\nThe company's migration plan states that only Platform as a Service (PaaS) solutions must be used in Azure.\nYou need to deploy an Azure environment that meets the company migration plan.\nSolution: You create an Azure App Service and Azure virtual machines that have Microsoft SQL Server installed.\nDoes this meet the goal?", "qEs": "Tu empresa planea migrar todos sus datos y recursos a Azure. El plan de migración establece que solo se deben usar soluciones de Plataforma como Servicio (PaaS) en Azure. Debes desplegar un entorno de Azure que cumpla el plan de migración de la empresa.\nSolución: Creas un Azure App Service y máquinas virtuales de Azure con Microsoft SQL Server instalado.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Las VM son IaaS, no PaaS.", "multi": false}, {"n": 43, "kind": "mc", "qEn": "Your company plans to migrate all its data and resources to Azure.\nThe company's migration plan states that only Platform as a Service (PaaS) solutions must be used in Azure.\nYou need to deploy an Azure environment that meets the company migration plan.\nSolution: You create an Azure App Service and Azure Storage accounts.\nDoes this meet the goal?", "qEs": "Tu empresa planea migrar todos sus datos y recursos a Azure. El plan de migración establece que solo se deben usar soluciones de Plataforma como Servicio (PaaS) en Azure. Debes desplegar un entorno de Azure que cumpla el plan de migración de la empresa.\nSolución: Creas un Azure App Service y cuentas de Azure Storage.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "⚠ Discutida: depende de si el examen considera Storage como PaaS. La clave dice No. Confírmala con tu profe.", "multi": false, "disputed": true}, {"n": 44, "kind": "mc", "qEn": "Your company hosts an accounting application named App1 that is used by all the customers of the company.\nApp1 has low usage during the first three weeks of each month and very high usage during the last week of each month.\nWhich benefit of Azure Cloud Services supports cost management for this type of usage pattern?", "qEs": "Tu empresa aloja una aplicación de contabilidad llamada App1, usada por todos los clientes. App1 tiene poco uso las tres primeras semanas de cada mes y un uso muy alto la última semana. ¿Qué ventaja de los servicios en la nube de Azure ayuda a gestionar los costes con este patrón de uso?", "oEn": ["high availability", "high latency", "elasticity", "load balancing"], "oEs": ["alta disponibilidad", "alta latencia", "elasticidad", "balanceo de carga"], "ans": [2], "why": "Elasticidad: los recursos suben y bajan según la demanda, y pagas solo lo usado.", "multi": false}, {"n": 45, "kind": "mc", "qEn": "You plan to migrate a web application to Azure. The web application is accessed by external users.\nYou need to recommend a cloud deployment solution to minimize the amount of administrative effort used to manage the web application.\nWhat should you include in the recommendation?", "qEs": "Planeas migrar una aplicación web a Azure. Usuarios externos acceden a ella. Debes recomendar una solución de despliegue en la nube que minimice el esfuerzo administrativo para gestionar la aplicación web. ¿Qué debes incluir?", "oEn": ["Software as a Service (SaaS)", "Platform as a Service (PaaS)", "Infrastructure as a Service (IaaS)", "Database as a Service (DaaS)"], "oEs": ["Software como Servicio (SaaS)", "Plataforma como Servicio (PaaS)", "Infraestructura como Servicio (IaaS)", "Base de datos como Servicio (DaaS)"], "ans": [1], "why": "PaaS: Azure gestiona SO y servidores; tú solo gestionas la aplicación.", "multi": false}, {"n": 46, "kind": "match", "qEn": "Which cloud deployment solution is used for Azure virtual machines and Azure SQL databases?", "qEs": "¿Qué modelo de servicio en la nube se usa para las máquinas virtuales de Azure y las bases de datos Azure SQL?", "rows": [{"en": "Azure virtual machines", "es": "Máquinas virtuales de Azure", "aEn": "IaaS", "aEs": "IaaS"}, {"en": "Azure SQL databases", "es": "Bases de datos Azure SQL", "aEn": "PaaS", "aEs": "PaaS"}], "pool": ["IaaS", "PaaS", "SaaS"], "why": "Las VM son IaaS; Azure SQL Database es un servicio gestionado (PaaS)."}, {"n": 47, "kind": "mc", "qEn": "You have an on-premises network that contains 100 servers.\nYou need to recommend a solution that provides additional resources to your users. The solution must minimize capital and operational expenditure costs.\nWhat should you include in the recommendation?", "qEs": "Tienes una red local con 100 servidores. Debes recomendar una solución que dé recursos adicionales a tus usuarios. La solución debe minimizar los costes de capital y operativos. ¿Qué debes incluir?", "oEn": ["a complete migration to the public cloud", "an additional data center", "a private cloud", "a hybrid cloud"], "oEs": ["una migración completa a la nube pública", "un centro de datos adicional", "una nube privada", "una nube híbrida"], "ans": [3], "why": "Nube híbrida: mantienes lo local y amplías con la nube pública sin comprar más hardware.", "multi": false}, {"n": 48, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "In a hybrid cloud, a company must always migrate from a private cloud to a public cloud.", "es": "En una nube híbrida, una empresa debe migrar siempre de una nube privada a una nube pública.", "yes": false}, {"en": "A company can extend the capacity of its internal network by using the public cloud.", "es": "Una empresa puede ampliar la capacidad de su red interna usando la nube pública.", "yes": true}, {"en": "In the public cloud, only guest users can access the resources.", "es": "En la nube pública, solo los usuarios invitados pueden acceder a los recursos.", "yes": false}], "why": "Híbrida = local + pública; no obliga a migrar todo."}, {"n": 49, "kind": "mc", "qEn": "You plan to migrate several servers from an on-premises network to Azure.\nWhat is an advantage of using a public cloud service for the servers over an on-premises network?", "qEs": "Planeas migrar varios servidores de una red local a Azure. ¿Cuál es una ventaja de usar un servicio de nube pública frente a una red local?", "oEn": ["The public cloud is owned by the public, NOT a private corporation", "The public cloud is a crowd-sourcing solution that provides corporations with the ability to enhance the cloud", "All public cloud resources can be freely accessed by every member of the public", "The public cloud is a shared entity whereby multiple corporations each use a portion of the resources in the cloud"], "oEs": ["La nube pública es propiedad del público, NO de una empresa privada", "La nube pública es una solución colaborativa (crowdsourcing) que permite a las empresas mejorar la nube", "Todos los recursos de la nube pública son accesibles libremente por cualquier persona", "La nube pública es una entidad compartida en la que varias empresas usan cada una una parte de los recursos"], "ans": [3], "why": "Nube pública = recursos compartidos entre muchos clientes (multi-tenant), con la propiedad de un proveedor.", "multi": false}, {"n": 50, "kind": "mc", "qEn": "Azure Site Recovery provides ____ for virtual machines.", "qEs": "Azure Site Recovery ofrece ____ para máquinas virtuales.", "oEn": ["fault tolerance", "disaster recovery", "elasticity", "high availability"], "oEs": ["tolerancia a fallos", "recuperación ante desastres", "elasticidad", "alta disponibilidad"], "ans": [1], "why": "Site Recovery replica las VM a otra región para recuperarlas tras un desastre.", "multi": false, "diagram": true}, {"n": 51, "kind": "mc", "qEn": "In which type of cloud model are all the hardware resources owned by a third-party and shared between multiple tenants?", "qEs": "¿En qué tipo de modelo de nube todo el hardware es propiedad de un tercero y se comparte entre varios inquilinos (tenants)?", "oEn": ["private", "hybrid", "public"], "oEs": ["privada", "híbrida", "pública"], "ans": [2], "why": "Nube pública: hardware de un tercero (p. ej., Microsoft) compartido entre varios clientes.", "multi": false}, {"n": 52, "kind": "mc", "qEn": "____ is a desktop and application virtualization service that enables use of cloud-hosted Windows from any location.", "qEs": "____ es un servicio de virtualización de escritorios y aplicaciones que permite usar Windows alojado en la nube desde cualquier lugar.", "oEn": ["An availability set", "Azure Spot VMs", "Azure Virtual Desktop", "Azure VM Scale Sets"], "oEs": ["Un conjunto de disponibilidad", "Azure Spot VMs", "Azure Virtual Desktop", "Azure VM Scale Sets"], "ans": [2], "why": "Azure Virtual Desktop = escritorios Windows en la nube.", "multi": false, "diagram": true}, {"n": 53, "kind": "mc", "qEn": "You have 1,000 virtual machines hosted on the Hyper-V hosts in a data center.\nYou plan to migrate all the virtual machines to an Azure pay-as-you-go subscription.\nYou need to identify which expenditure model to use for the planned Azure solution.\nWhich expenditure model should you identify?", "qEs": "Tienes 1.000 máquinas virtuales alojadas en hosts Hyper-V de un centro de datos. Planeas migrarlas todas a una suscripción de Azure de pago por uso. Debes identificar qué modelo de gasto usar. ¿Cuál?", "oEn": ["operational", "elastic", "capital", "scalable"], "oEs": ["operativo (OpEx)", "elástico", "de capital (CapEx)", "escalable"], "ans": [0], "why": "Pago por uso = gasto operativo (OpEx).", "multi": false}, {"n": 54, "kind": "match", "qEn": "Match the Azure services benefits to the correct descriptions.", "qEs": "Relaciona los beneficios de los servicios de Azure con la descripción correcta.", "rows": [{"en": "A service that remains available after a failure.", "es": "Un servicio que sigue disponible tras un fallo.", "aEn": "Fault tolerance", "aEs": "Tolerancia a fallos"}, {"en": "A service that can be recovered after a failure.", "es": "Un servicio que se puede recuperar tras un fallo.", "aEn": "Disaster recovery", "aEs": "Recuperación ante desastres"}, {"en": "A service that performs quickly when demand increases.", "es": "Un servicio que responde rápido cuando aumenta la demanda.", "aEn": "Dynamic scalability", "aEs": "Escalabilidad dinámica"}, {"en": "A service that can be accessed quickly from the Internet.", "es": "Un servicio al que se accede rápidamente desde Internet.", "aEn": "Low latency", "aEs": "Baja latencia"}], "pool": ["Disaster recovery", "Fault tolerance", "Low latency", "Dynamic scalability"], "why": "Cada beneficio describe una propiedad distinta."}, {"n": 55, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "To implement a hybrid cloud, a company must have an internal network.", "es": "Para implementar una nube híbrida, una empresa debe tener una red interna.", "yes": true}, {"en": "A company can extend the computing resources of its internal network by using a hybrid cloud.", "es": "Una empresa puede ampliar los recursos de cómputo de su red interna usando una nube híbrida.", "yes": true}, {"en": "In the public cloud, only guest users can access the resources.", "es": "En la nube pública, solo los usuarios invitados pueden acceder a los recursos.", "yes": false}], "why": "Híbrida = tu red interna + nube pública."}, {"n": 56, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "PaaS provides full control of the operating system that hosts apps.", "es": "PaaS da control total del sistema operativo que aloja las aplicaciones.", "yes": false}, {"en": "PaaS provides additional memory to apps by changing pricing tiers.", "es": "PaaS da más memoria a las aplicaciones cambiando de nivel de precios.", "yes": true}, {"en": "PaaS can automatically scale the number of instances.", "es": "PaaS puede escalar automáticamente el número de instancias.", "yes": true}], "why": "En PaaS no controlas el SO; sí puedes cambiar el plan y autoescalar."}, {"n": 57, "kind": "mc", "qEn": "Your company has an on-premises network that contains multiple servers.\nThe company plans to reduce the following administrative responsibilities:\n✑ Backing up application data\n✑ Replacing failed server hardware\n✑ Managing physical server security\n✑ Updating server operating systems\n✑ Managing permissions to shared documents\nThe company plans to migrate servers to Azure virtual machines.\nYou need to identify which administrative responsibilities will be eliminated after the planned migration.\nWhich two responsibilities should you identify? Each correct answer presents a complete solution.", "qEs": "La red local de tu empresa tiene varios servidores. La empresa planea reducir estas responsabilidades administrativas:\n✑ Copias de seguridad de los datos de aplicaciones\n✑ Reemplazo del hardware de servidor averiado\n✑ Gestión de la seguridad física de los servidores\n✑ Actualización de los sistemas operativos de los servidores\n✑ Gestión de permisos de documentos compartidos\nLa empresa planea migrar los servidores a máquinas virtuales de Azure. Debes identificar qué responsabilidades se eliminarán tras la migración. ¿Cuáles dos? Cada respuesta correcta presenta una solución completa.", "oEn": ["Replacing failed server hardware", "Backing up application data", "Managing physical server security", "Updating server operating systems", "Managing permissions to shared documents"], "oEs": ["Reemplazar hardware de servidor averiado", "Hacer copias de seguridad de datos de aplicaciones", "Gestionar la seguridad física de los servidores", "Actualizar los sistemas operativos de los servidores", "Gestionar permisos de documentos compartidos"], "ans": [0, 2], "why": "En IaaS Microsoft se encarga del hardware y de la seguridad física; tú sigues con SO, datos y permisos.", "multi": true}, {"n": 58, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "Azure pay-as-you-go pricing is an example of capital expenditure (CapEx).", "es": "El precio de pago por uso de Azure es un ejemplo de gasto de capital (CapEx).", "yes": false}, {"en": "Paying for electricity for your datacenter is an example of operational expenditure (OpEx).", "es": "Pagar la electricidad de tu centro de datos es un ejemplo de gasto operativo (OpEx).", "yes": true}, {"en": "Deploying your own datacenter is an example of CapEx.", "es": "Desplegar tu propio centro de datos es un ejemplo de CapEx.", "yes": true}], "why": "CapEx = inversión inicial; OpEx = gasto continuo."}, {"n": 59, "kind": "mc", "qEn": "You plan to provision Infrastructure as a Service (IaaS) resources in Azure.\nWhich resource is an example of IaaS?", "qEs": "Planeas aprovisionar recursos de Infraestructura como Servicio (IaaS) en Azure. ¿Qué recurso es un ejemplo de IaaS?", "oEn": ["an Azure web app", "an Azure virtual machine", "an Azure logic app", "an Azure SQL database"], "oEs": ["una aplicación web de Azure (web app)", "una máquina virtual de Azure", "una aplicación lógica de Azure (logic app)", "una base de datos Azure SQL"], "ans": [1], "why": "Las VM son IaaS; los demás son PaaS.", "multi": false}, {"n": 60, "kind": "mc", "qEn": "To which cloud models can you deploy physical servers?", "qEs": "¿En qué modelos de nube puedes desplegar servidores físicos?", "oEn": ["private cloud and hybrid cloud only", "private cloud only", "private cloud, hybrid cloud and public cloud", "hybrid cloud only"], "oEs": ["solo en nube privada y nube híbrida", "solo en nube privada", "en nube privada, híbrida y pública", "solo en nube híbrida"], "ans": [0], "why": "Los servidores físicos propios están en tu centro de datos (privada), que forma parte de una híbrida. En la pública no se despliegan servidores físicos.", "multi": false}, {"n": 61, "kind": "match", "qEn": "Match the cloud model to the correct advantage.", "qEs": "Relaciona el modelo de nube con la ventaja correcta.", "rows": [{"en": "No required capital expenditure", "es": "No requiere gasto de capital", "aEn": "Public cloud", "aEs": "Nube pública"}, {"en": "Provides complete control over security", "es": "Da control total sobre la seguridad", "aEn": "Private cloud", "aEs": "Nube privada"}, {"en": "Provides a choice to use on-premises or cloud-based resources", "es": "Permite elegir entre recursos locales o en la nube", "aEn": "Hybrid cloud", "aEs": "Nube híbrida"}], "pool": ["Hybrid cloud", "Private cloud", "Public cloud"], "why": "Pública: sin inversión. Privada: control total. Híbrida: lo mejor de ambas."}, {"n": 62, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "A company can extend a private cloud by adding its own physical servers to the public cloud.", "es": "Una empresa puede ampliar una nube privada añadiendo sus propios servidores físicos a la nube pública.", "yes": false}, {"en": "To build a hybrid cloud, you must deploy resources to the public cloud.", "es": "Para construir una nube híbrida debes desplegar recursos en la nube pública.", "yes": false}, {"en": "A private cloud must be disconnected from the Internet.", "es": "Una nube privada debe estar desconectada de Internet.", "yes": false}], "why": "Los servidores físicos no se añaden a la nube pública; una privada puede tener Internet."}, {"n": 63, "kind": "mc", "qEn": "You have 50 virtual machines hosted on-premises and 50 virtual machines hosted in Azure. The on-premises virtual machines and the Azure virtual machines connect to each other.\nWhich type of cloud model is this?", "qEs": "Tienes 50 máquinas virtuales alojadas en tu red local y 50 alojadas en Azure. Las VM locales y las de Azure se conectan entre sí. ¿Qué tipo de modelo de nube es?", "oEn": ["hybrid", "private", "public"], "oEs": ["híbrida", "privada", "pública"], "ans": [0], "why": "Local + nube pública conectadas = nube híbrida.", "multi": false}, {"n": 64, "kind": "yn", "qEn": "For each statement, select Yes if the statement is true. Otherwise, select No.", "qEs": "Para cada afirmación, elige Sí si es verdadera. Si no, elige No.", "rows": [{"en": "PaaS web apps provide full control of the operating system that hosts the apps.", "es": "Las aplicaciones web PaaS dan control total del sistema operativo.", "yes": false}, {"en": "PaaS web apps can get additional memory by changing the pricing tier.", "es": "Las aplicaciones web PaaS pueden obtener más memoria cambiando el nivel de precios.", "yes": true}, {"en": "PaaS web apps can be configured to automatically scale the number of instances based on demand.", "es": "Las aplicaciones web PaaS pueden escalar automáticamente el número de instancias según la demanda.", "yes": true}], "why": "PaaS: sin control del SO, pero con autoescalado."}, {"n": 65, "kind": "mc", "qEn": "Your company plans to migrate all its data and resources to Azure.\nThe company's migration plan states that only Platform as a Service (PaaS) solutions must be used in Azure.\nYou need to deploy an Azure environment that meets the company migration plan.\nSolution: You create Azure virtual machines, Azure SQL databases, and Azure Storage accounts.\nDoes this meet the goal?", "qEs": "Tu empresa planea migrar todos sus datos y recursos a Azure. El plan de migración establece que solo se deben usar soluciones de Plataforma como Servicio (PaaS) en Azure. Debes desplegar un entorno de Azure que cumpla el plan de migración de la empresa.\nSolución: Creas máquinas virtuales de Azure, bases de datos Azure SQL y cuentas de Azure Storage.\n¿Cumple la solución el objetivo?", "oEn": ["Yes", "No"], "oEs": ["Sí", "No"], "ans": [1], "why": "Las VM son IaaS, no PaaS.", "multi": false}, {"n": 66, "kind": "mc", "qEn": "Your company plans to deploy several custom applications to Azure. The applications will provide invoicing services to the customers of the company. Each application will have several prerequisite applications and services installed.\nYou need to recommend a cloud deployment solution for all the applications.\nWhat should you recommend?", "qEs": "Tu empresa planea desplegar varias aplicaciones personalizadas en Azure para ofrecer servicios de facturación a sus clientes. Cada aplicación tendrá instalados varios requisitos previos (aplicaciones y servicios). Debes recomendar una solución de despliegue en la nube para todas las aplicaciones. ¿Qué recomiendas?", "oEn": ["Software as a Service (SaaS)", "Platform as a Service (PaaS)", "Infrastructure as a Service (laaS)"], "oEs": ["Software como Servicio (SaaS)", "Plataforma como Servicio (PaaS)", "Infraestructura como Servicio (IaaS)"], "ans": [2], "why": "Si necesitas instalar p const L='ABCDEFGH';
const KEY='az900-done-v1';
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}}
const st={lang:'both',range:'all',kind:'all',q:'',pend:false,open:new Set(),allOpen:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND={mc:'Elegir opción',yn:'Sí / No',match:'Relacionar'};
function side(d,lang,show){
  const es=lang==='es', q=es?d.qEs:d.qEn;
  let h=`<div class="col ${lang}"><div class="lang">${es?'ESPAÑOL':'ENGLISH'}</div><p class="q">${esc(q)}</p>`;
  if(d.kind==='mc'){
    const o=es?d.oEs:d.oEn;
    h+='<ul class="opts">'+o.map((t,i)=>`<li class="${show&&d.ans.includes(i)?'right':''}"><b>${L[i]}.</b><span>${esc(t)}</span></li>`).join('')+'</ul>';
    if(show) h+=`<p class="pool"><b>${es?'Respuesta':'Answer'}:</b> ${d.ans.map(i=>L[i]).join(', ')}</p>`;
  }else if(d.kind==='yn'){
    h+='<div class="rows">'+d.rows.map(r=>{
      const t=es?r.es:r.en, a=r.yes?(es?'Sí':'Yes'):'No';
      return `<div class="row"><span class="t">${esc(t)}</span>${show?`<span class="pill ${r.yes?'y':'n'}">${a}</span>`:`<span class="pill">${es?'Sí / No':'Yes / No'}</span>`}</div>`}).join('')+'</div>';
  }else{
    h+='<div class="rows">'+d.rows.map(r=>{
      const t=es?r.es:r.en, a=es?r.aEs:r.aEn;
      return `<div class="row"><span class="t">${esc(t)}</span>${show?`<span class="pill m">${esc(a)}</span>`:'<span class="pill">?</span>'}</div>`}).join('')+'</div>';
    h+=`<p class="pool">${es?'Opciones':'Options'}: ${esc(d.pool.join(' · '))}</p>`;
  }
  return h+'</div>';
}
function card(d){
  const show=st.allOpen||st.open.has(d.n);
  const cols=st.lang==='both'?'cols':'cols one';
  const sides=(st.lang!=='en'?side(d,'es',show):'')+(st.lang!=='es'?side(d,'en',show):'');
  return `<article class="card" id="p${d.n}" data-n="${d.n}"><div class="top"><span class="num">P${d.n}</span><span class="tag">${KIND[d.kind]}${d.multi?' · varias respuestas':''}${d.disputed?' · respuesta discutida':''}</span><label class="done"><input type="checkbox" data-done="${d.n}" ${done.has(d.n)?'checked':''}> Estudiada</label></div><div class="${cols}">${sides}</div><div class="foot"><button class="show" data-show="${d.n}" aria-expanded="${show}">${show?'Ocultar respuesta':'Ver respuesta'}</button>${show?`<div class="why"><b>Por qué:</b> ${esc(d.why)}</div>`:''}</div></article>`;
}
function text(d){return [d.qEn,d.qEs,...(d.oEn||[]),...(d.oEs||[]),...(d.rows||[]).flatMap(r=>[r.en,r.es,r.aEn||'',r.aEs||''])].join(' ').toLowerCase()}
const IDX=DATA.map(d=>[d,text(d)]);
function render(){
  const q=st.q.trim().toLowerCase();
  const list=IDX.filter(([d,t])=>{
    if(st.range!=='all'){const [a,b]=st.range.split('-').map(Number);if(d.n<a||d.n>b)return false}
    if(st.kind!=='all'&&d.kind!==st.kind)return false;
    if(st.pend&&done.has(d.n))return false;
    if(q&&!t.includes(q))return false;
    return true}).map(x=>x[0]);
  $('#list').innerHTML=list.length?list.map(card).join(''):'<p class="empty">Ninguna pregunta coincide con el filtro.</p>';
  $('#stat').textContent=`${list.length} mostradas · ${done.size}/120 estudiadas`;
  $('#all').textContent=st.allOpen?'Ocultar todas las respuestas':'Ver todas las respuestas';
}
const rs=$('#range');
rs.innerHTML='<option value="all">Todas (1–120)</option>'+[...Array(12)].map((_,i)=>`<option value="${i*10+1}-${i*10+10}">${i*10+1}–${i*10+10}</option>`).join('');
$('#langseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.lang=b.dataset.l;document.querySelectorAll('#langseg button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
rs.addEventListener('change',()=>{st.range=rs.value;render()});
$('#kind').addEventListener('change',e=>{st.kind=e.target.value;render()});
$('#q').addEventListener('input',e=>{st.q=e.target.value;render()});
$('#all').addEventListener('click',()=>{st.allOpen=!st.allOpen;st.open.clear();render()});
$('#pend').addEventListener('click',e=>{st.pend=!st.pend;e.currentTarget.setAttribute('aria-pressed',st.pend);e.currentTarget.textContent=st.pend?'Mostrar todas':'Solo pendientes';render()});
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-show]');
  if(b){const n=+b.dataset.show;if(st.allOpen){st.allOpen=false;DATA.forEach(d=>st.open.add(d.n));}
    st.open.has(n)?st.open.delete(n):st.open.add(n);
    const el=document.getElementById('p'+n);const d=DATA[n-1];el.outerHTML=card(d);$('#all').textContent='Ver todas las respuestas';}
});
$('#list').addEventListener('change',e=>{
  const c=e.target.closest('[data-done]');if(!c)return;
  const n=+c.dataset.done;c.checked?done.add(n):done.delete(n);save();
  $('#stat').textContent=$('#stat').textContent.replace(/\d+\/120/,done.size+'/120');
  if(st.pend)render();
});
render();
</script>
